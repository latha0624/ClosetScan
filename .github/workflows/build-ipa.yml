name: Build ClosetScan IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-ipa:
    name: Unsigned IPA (for Sideloadly)
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build unsigned IPA
        run: |
          chmod +x scripts/build_unsigned_ipa.sh
          scripts/build_unsigned_ipa.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClosetScan-ipa
          path: build/ClosetScan.ipa
          if-no-files-found: error
          retention-days: 7
