name: ClosetScan
options:
  bundleIdPrefix: com.closetscan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  BASE_SDK: iphoneos
  SWIFT_VERSION: "5.0"
  TARGETED_DEVICE_FAMILY: "1,2"

targets:
  ClosetScan:
    type: application
    platform: iOS
    sources:
      - path: ClosetScan
        excludes:
          - Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.closetscan.demo
      INFOPLIST_FILE: ClosetScan/Info.plist
      GENERATE_INFOPLIST_FILE: false
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: "1.0"
      DEVELOPMENT_TEAM: ""
      CODE_SIGN_STYLE: Automatic
      SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
    info:
      path: ClosetScan/Info.plist
